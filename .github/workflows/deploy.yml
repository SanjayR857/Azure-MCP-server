name: Test, Build & Push to ACR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  IMAGE_NAME: azure-mcp-server
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}

jobs:
  test:
    name: Run Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Unit Tests
        run: |
          pytest -v

  build-and-push:
    name: Build & Push Docker Image to ACR
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize and Validate Configuration
        run: |
          # Strip accidental trailing newlines, carriage returns, or spaces from GitHub Secrets
          CLEAN_ACR=$(echo "${{ secrets.ACR_NAME }}" | tr -d '[:space:]')
          CLEAN_RG=$(echo "${{ secrets.RESOURCE_GROUP }}" | tr -d '[:space:]')
          CLEAN_APP=$(echo "${{ secrets.CONTAINER_APP_NAME }}" | tr -d '[:space:]')

          missing=""
          [ -z "$CLEAN_ACR" ] && missing="${missing} ACR_NAME"
          [ -z "$CLEAN_RG" ] && missing="${missing} RESOURCE_GROUP"
          [ -z "$CLEAN_APP" ] && missing="${missing} CONTAINER_APP_NAME"

          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):${missing}."
            echo "::notice::Add them in GitHub -> Settings -> Secrets and variables -> Actions -> Repository Secrets."
            exit 1
          fi

          echo "ACR_NAME=${CLEAN_ACR}" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=${CLEAN_RG}" >> $GITHUB_ENV
          echo "CONTAINER_APP_NAME=${CLEAN_APP}" >> $GITHUB_ENV
          echo "IMAGE_NAME=azure-mcp-server" >> $GITHUB_ENV

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: |
          TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | docker login "${ACR_NAME}.azurecr.io" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}" \
            -t "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest" \
            .

      - name: Push Docker Image to ACR
        run: |
          docker push "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"
          docker push "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest"

      - name: Deploy to Azure Container App
        run: |
          if az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" > /dev/null 2>&1; then
            echo "Updating Azure Container App $CONTAINER_APP_NAME..."
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"
          else
            echo "::notice::Container App '$CONTAINER_APP_NAME' does not exist yet in '$RESOURCE_GROUP'. Image pushed to ACR successfully."
          fi

